<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Drawer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      touch-action: none;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    /* The camera feed and the stencil live together on the stage, so detail zoom
       magnifies both by exactly the same amount and they stay lined up. */
    #stage {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
      will-change: transform;
    }

    #stage.animate,
    #overlay.animate {
      transition: transform 0.25s ease-out;
    }

    /* Sized and positioned from script: it covers the screen like object-fit: cover,
       but isn't cropped, so zooming out below 1× reveals the rest of the camera frame. */
    video {
      position: absolute;
      display: block;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
    }

    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      max-width: 80%;
      max-height: 80%;
      transform: translate(-50%, -50%);
      z-index: 5;
      touch-action: none;
      display: none;
    }

    .pill {
      position: fixed;
      top: 15px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      cursor: pointer;
    }

    .pill[hidden] {
      display: none;
    }

    #zoomBadge {
      left: 50%;
      transform: translateX(-50%);
    }

    #lensBtn {
      left: 15px;
    }

    #toast {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      max-width: calc(100% - 60px);
      background: rgba(0, 0, 0, 0.75);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #toast.show {
      opacity: 1;
    }

    #controls {
      position: fixed;
      bottom: 15px;
      left: 15px;
      right: 15px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0, 0, 0, 0.6);
      padding: 0 12px 10px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    #controls.collapsed .row:not(.tools) {
      display: none;
    }

    /* Handle at the top of the panel that hides/shows the sliders */
    #controls #collapseBtn {
      align-self: center;
      width: 100%;
      height: 18px;
      padding: 0;
      background: none;
      box-shadow: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #collapseBtn::before {
      content: "";
      width: 36px;
      height: 5px;
      border-radius: 3px;
      background: #fff8;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: flex-end;
      justify-content: center;
    }

    .row[hidden] {
      display: none;
    }

    .row.tools {
      gap: 8px;
    }

    #controls button {
      background: linear-gradient(to bottom, #444, #222);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
    }

    #controls button:hover {
      background: linear-gradient(to bottom, #666, #333);
      box-shadow: 0 0 10px #fff8; /* white glow on hover */
    }

    #controls #collapseBtn:hover {
      background: none;
      box-shadow: none;
    }

    #controls button.on {
      background: #fff;
      color: #000;
    }

    #controls button:disabled {
      opacity: 0.4;
    }

    /* Toolbar buttons: icon on top, short label underneath */
    #controls .tool {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      width: 56px;
      height: 48px;
      padding: 0;
      font-size: 11px;
    }

    #controls .tool .icon {
      font-size: 18px;
      line-height: 1;
    }

    #controls .small {
      height: 30px;
      padding: 0 10px;
    }

    #colorSwatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: -1px;
      border: 1px solid #fff8;
    }

    .ctl {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: #ccc;
    }

    .ctl:has(input:disabled) {
      opacity: 0.4;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100px;
      height: 6px;
      background: #333;
      border-radius: 5px;
      outline: none;
      transition: 0.2s ease;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      background: #fff; /* changed thumb color to white */
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px #fff8; /* white glow */
      transition: 0.2s ease;
      margin-top: -6px;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #fff;
      box-shadow: 0 0 15px #fff9;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 6px;
      background: #222;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <button id="lensBtn" class="pill" hidden></button>
  <button id="zoomBadge" class="pill" hidden></button>
  <div id="toast"></div>

  <div id="controls">
    <button id="collapseBtn" aria-label="Show or hide sliders"></button>
    <div class="row">
      <label class="ctl"><span>Size</span>
        <input id="sizeSlider" type="range" min="-2.3026" max="2.3026" step="0.001" value="0">
      </label>
      <label class="ctl"><span>Opacity</span>
        <input id="opacitySlider" type="range" min="0.05" max="1" step="0.01" value="0.5">
      </label>
    </div>
    <div class="row" id="lineRow" hidden>
      <label class="ctl"><span>Line detail</span>
        <input id="detailSlider" type="range" min="0" max="1" step="0.01" value="0.6">
      </label>
      <label class="ctl"><span>Line weight</span>
        <input id="weightSlider" type="range" min="0.3" max="4" step="0.05" value="1">
      </label>
      <label class="ctl"><span>Line darkness</span>
        <input id="strengthSlider" type="range" min="0.5" max="10" step="0.1" value="3">
      </label>
      <label class="ctl"><span>Shading</span>
        <input id="shadingSlider" type="range" min="0" max="1" step="0.01" value="0.5">
      </label>
      <button id="tonesBtn" class="small"></button>
      <button id="colorBtn" class="small"><span id="colorSwatch"></span><span id="colorName"></span></button>
    </div>
    <div class="row tools">
      <button class="tool" id="lockBtn"><span class="icon">🔓</span><span class="label">Lock</span></button>
      <button class="tool" id="lineBtn"><span class="icon">✏️</span><span>Line art</span></button>
      <button class="tool" id="saveBtn"><span class="icon">📌</span><span>Save spot</span></button>
      <button class="tool" id="revertBtn"><span class="icon">↩️</span><span>Revert</span></button>
      <button class="tool" id="photoBtn"><span class="icon">🖼️</span><span>Photo</span></button>
    </div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");
    const overlayCtx = overlay.getContext("2d");
    const lensBtn = document.getElementById("lensBtn");
    const zoomBadge = document.getElementById("zoomBadge");
    const toast = document.getElementById("toast");
    const controls = document.getElementById("controls");
    const collapseBtn = document.getElementById("collapseBtn");
    const sizeSlider = document.getElementById("sizeSlider");
    const opacitySlider = document.getElementById("opacitySlider");
    const lineRow = document.getElementById("lineRow");
    const detailSlider = document.getElementById("detailSlider");
    const weightSlider = document.getElementById("weightSlider");
    const strengthSlider = document.getElementById("strengthSlider");
    const shadingSlider = document.getElementById("shadingSlider");
    const tonesBtn = document.getElementById("tonesBtn");
    const colorBtn = document.getElementById("colorBtn");
    const colorSwatch = document.getElementById("colorSwatch");
    const colorName = document.getElementById("colorName");
    const lockBtn = document.getElementById("lockBtn");
    const lineBtn = document.getElementById("lineBtn");
    const saveBtn = document.getElementById("saveBtn");
    const revertBtn = document.getElementById("revertBtn");
    const photoBtn = document.getElementById("photoBtn");

    const MIN_SCALE = 0.1, MAX_SCALE = 10;
    const MAX_VIEW_ZOOM = 8;
    const DETAIL_ZOOM = 3;        // how far a double-tap zooms in when the image is locked
    const TAP_SLOP = 10;          // px a finger can drift and still count as a tap / long-press
    const DOUBLE_TAP_MS = 300;
    const LONG_PRESS_MS = 1500;
    // Largest stencil we'll draw. iOS refuses canvases over ~16.7 million pixels.
    const MAX_SIDE = 4096, MAX_AREA = 16000000;
    // Ask for the camera's full 4:3 sensor at high resolution: 4:3 shows the widest
    // view, and detail zoom benefits from the extra pixels.
    const SHARP = { width: { ideal: 4032 }, height: { ideal: 3024 } };
    const LINE_COLORS = [
      ["Red", [230, 30, 60]],
      ["Blue", [20, 90, 255]],
      ["Black", [0, 0, 0]],
      ["Green", [0, 170, 70]]
    ];
    const TONE_STEPS = [0, 3, 5, 8];   // 0 = smooth shading

    // Stencil position/size/rotation, in stage coordinates
    let originX = 0, originY = 0, scale = 1, rotation = 0;
    // Detail zoom: the stage is drawn at screen = (viewX, viewY) + viewZoom * stagePoint
    let viewX = 0, viewY = 0, viewZoom = 1;
    // Where the video sits on the stage (it overhangs the screen on two sides)
    let videoBox = null;
    let locked = false;
    let savedSpot = null;
    let sourceImage = null;   // the decoded photo the stencil is drawn from
    let overlayURL = null;

    // ---------- Small helpers ----------

    function num(value, fallback) {
      const n = parseFloat(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function clampScale(s) {
      return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));
    }

    function storageGet(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }

    function storageSet(key, value) {
      try { localStorage.setItem(key, value); } catch (e) { console.warn("Could not save", key, e); }
    }

    function storageRemove(key) {
      try { localStorage.removeItem(key); } catch (e) { /* nothing to do */ }
    }

    function storageJSON(key) {
      try { return JSON.parse(storageGet(key)); } catch (e) { return null; }
    }

    let toastTimer = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
    }

    // ---------- Stencil position / size / rotation ----------

    function applyTransform(animate = false) {
      overlay.classList.toggle("animate", animate);
      overlay.style.transform =
        `translate(-50%, -50%) translate(${originX}px, ${originY}px) scale(${scale}) rotate(${rotation}deg)`;
      sizeSlider.value = Math.log(scale);
    }

    function saveTransform() {
      storageSet("savedTransform", JSON.stringify({ x: originX, y: originY, scale, rotation }));
    }

    function readTransform(t) {
      if (!t) return null;
      return { x: num(t.x, 0), y: num(t.y, 0), scale: clampScale(num(t.scale, 1)), rotation: num(t.rotation, 0) };
    }

    function loadTransform() {
      const t = readTransform(storageJSON("savedTransform"));
      if (t) {
        ({ x: originX, y: originY, scale, rotation } = t);
        return;
      }
      // Older versions saved each value under its own key
      const pos = storageJSON("savedPosition");
      if (pos) {
        originX = num(pos.x, 0);
        originY = num(pos.y, 0);
      }
      scale = clampScale(num(storageGet("savedScale"), 1));
      rotation = num(storageGet("savedRotation"), 0);
    }

    function resetTransform() {
      originX = 0;
      originY = 0;
      scale = 1;
      rotation = 0;
      applyTransform();
      saveTransform();
    }

    sizeSlider.addEventListener("input", () => {
      scale = clampScale(Math.exp(parseFloat(sizeSlider.value)));
      applyTransform();
    });
    sizeSlider.addEventListener("change", saveTransform);

    // ---------- Detail zoom (magnifies camera + stencil together) ----------

    // Size the video to cover the screen without cropping it, so the parts of the
    // camera frame that hang off the screen can be revealed by zooming out.
    function layoutVideo() {
      const W = stage.offsetWidth, H = stage.offsetHeight;
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) {
        videoBox = { x: 0, y: 0, w: W, h: H };
      } else {
        const s = Math.max(W / vw, H / vh);
        videoBox = { w: vw * s, h: vh * s, x: (W - vw * s) / 2, y: (H - vh * s) / 2 };
      }
      video.style.left = videoBox.x + "px";
      video.style.top = videoBox.y + "px";
      video.style.width = videoBox.w + "px";
      video.style.height = videoBox.h + "px";
      applyView();
    }

    // Zooming out stops once the whole camera frame fits on screen
    function minViewZoom() {
      return Math.min(1, stage.offsetWidth / videoBox.w, stage.offsetHeight / videoBox.h);
    }

    // Keep the camera frame filling the screen along one axis; centre it if it's smaller
    function clampAxis(pos, start, size, screen) {
      const span = viewZoom * size;
      if (span <= screen) return (screen - span) / 2 - viewZoom * start;
      return Math.min(-viewZoom * start, Math.max(screen - viewZoom * (start + size), pos));
    }

    function clampView() {
      viewZoom = Math.min(MAX_VIEW_ZOOM, Math.max(minViewZoom(), viewZoom));
      viewX = clampAxis(viewX, videoBox.x, videoBox.w, stage.offsetWidth);
      viewY = clampAxis(viewY, videoBox.y, videoBox.h, stage.offsetHeight);
    }

    function applyView(animate = false) {
      clampView();
      stage.classList.toggle("animate", animate);
      stage.style.transform = `translate(${viewX}px, ${viewY}px) scale(${viewZoom})`;
      zoomBadge.hidden = Math.abs(viewZoom - 1) < 0.01;
      zoomBadge.textContent = `${viewZoom.toFixed(1)}× · tap for 1×`;
    }

    // Zoom so the stage point currently under screen point (x, y) stays under it
    function zoomViewAround(newZoom, x, y, animate = false) {
      const k = Math.min(MAX_VIEW_ZOOM, Math.max(minViewZoom(), newZoom)) / viewZoom;
      viewX = x - k * (x - viewX);
      viewY = y - k * (y - viewY);
      viewZoom *= k;
      applyView(animate);
    }

    function resetView() {
      viewX = 0;
      viewY = 0;
      viewZoom = 1;
      applyView(true);
    }

    stage.addEventListener("transitionend", e => e.target.classList.remove("animate"));
    zoomBadge.addEventListener("click", resetView);
    window.addEventListener("resize", layoutVideo);
    video.addEventListener("loadedmetadata", layoutVideo);
    video.addEventListener("resize", layoutVideo);   // camera frame size changed (e.g. rotation)

    // ---------- Saved spot (stencil + zoom + lens) ----------

    function readSpot(s) {
      const t = readTransform(s);
      if (!t) return null;
      if (s.view) t.view = { x: num(s.view.x, 0), y: num(s.view.y, 0), zoom: num(s.view.zoom, 1) };
      if (s.lens && typeof s.lens.deviceId === "string") t.lens = { deviceId: s.lens.deviceId, zoom: s.lens.zoom };
      return t;
    }

    function setSavedSpot(spot) {
      savedSpot = spot;
      revertBtn.disabled = !spot;
      if (spot) storageSet("savedSpot", JSON.stringify(spot));
      else storageRemove("savedSpot");
    }

    async function revertToSavedSpot() {
      if (!savedSpot) {
        showToast("No saved spot yet. Tap 📌 Save spot first.");
        return;
      }
      // Switch back to the lens the spot was saved with, since lenses see the paper at different sizes
      if (savedSpot.lens) {
        const i = lenses.findIndex(l => sameLens(l, savedSpot.lens));
        if (i >= 0 && i !== currentLens) await selectLens(i, { quiet: true });
      }
      ({ x: originX, y: originY, scale, rotation } = savedSpot);
      applyTransform(true);
      saveTransform();
      if (savedSpot.view) {
        ({ x: viewX, y: viewY, zoom: viewZoom } = savedSpot.view);
        applyView(true);
      } else {
        resetView();
      }
      showToast("Back to your saved spot");
    }

    saveBtn.addEventListener("click", () => {
      if (!sourceImage) {
        showToast("Choose a photo first.");
        return;
      }
      setSavedSpot({
        x: originX, y: originY, scale, rotation,
        view: { x: viewX, y: viewY, zoom: viewZoom },
        lens: lenses[currentLens] ? lensId(lenses[currentLens]) : undefined
      });
      showToast(`Spot saved at ${viewZoom.toFixed(1)}× zoom. Tap ↩️ Revert or two-finger tap to come back here.`);
    });

    revertBtn.addEventListener("click", revertToSavedSpot);

    // ---------- Lock ----------

    function setLocked(value) {
      locked = value;
      lockBtn.querySelector(".icon").textContent = locked ? "🔒" : "🔓";
      lockBtn.querySelector(".label").textContent = locked ? "Locked" : "Lock";
      lockBtn.classList.toggle("on", locked);
      sizeSlider.disabled = locked;
      storageSet("imageLocked", locked ? "1" : "0");
    }

    lockBtn.addEventListener("click", () => {
      setLocked(!locked);
      showToast(locked
        ? "Image locked. Pinch or double-tap anywhere to zoom."
        : "Image unlocked. Drag and pinch the image to adjust it.");
    });

    // ---------- Panel ----------

    function setCollapsed(value) {
      controls.classList.toggle("collapsed", value);
      storageSet("panelCollapsed", value ? "1" : "0");
    }

    collapseBtn.addEventListener("click", () => setCollapsed(!controls.classList.contains("collapsed")));

    // ---------- Opacity ----------

    opacitySlider.value = num(storageGet("savedOpacity"), 0.5);
    overlay.style.opacity = opacitySlider.value;

    opacitySlider.addEventListener("input", () => {
      overlay.style.opacity = opacitySlider.value;
      storageSet("savedOpacity", opacitySlider.value);
    });

    // ---------- Line art ----------

    // Runs in a background thread so the app stays smooth on big photos.
    // Two layers are combined:
    //  - Lines: edge detection. Wherever brightness or colour changes, a line is drawn
    //    along the exact centre of the change (one pixel wide, then thickened by Line
    //    weight). Edges are found at a fine and a coarser scale, so both crisp and soft
    //    edges show up, and their strength is measured relative to this photo's own
    //    edges, so soft photos get as much detail as sharp ones.
    //  - Shading: how dark the photo is at each pixel, optionally grouped into value bands.
    // The expensive edge finding runs once per photo; slider changes only redo the cheap parts.
    function lineArtWorker() {
      // Images are stored in 16-bit arrays (values ×256 or scaled), which is precise
      // enough and keeps memory down for 12-megapixel photos on a phone.
      let w = 0, h = 0, n = 0;
      let lum = null;        // brightness, 0-255
      let toneBlur = null;   // softened brightness ×256, for clean value bands
      let edges = [];        // per scale: edge strength (1 = this photo's strong edges) ×16384
      let noise = [];        // per scale: typical faint-edge level, as a fraction of strong edges
      let ink = null, buf = null, tmp = null;
      let kept = null, stack = null;

      // Box widths whose three passes together approximate a Gaussian blur
      function boxSizes(sigma, count) {
        const wIdeal = Math.sqrt(12 * sigma * sigma / count + 1);
        let wl = Math.floor(wIdeal);
        if (wl % 2 === 0) wl--;
        const wu = wl + 2;
        const m = Math.round((12 * sigma * sigma - count * wl * wl - 4 * count * wl - 3 * count) / (-4 * wl - 4));
        const sizes = [];
        for (let i = 0; i < count; i++) sizes.push(i < m ? wl : wu);
        return sizes;
      }

      function boxBlurH(src, dst, r) {
        const norm = 1 / (2 * r + 1);
        for (let y = 0; y < h; y++) {
          const row = y * w;
          let acc = r * src[row];
          for (let j = 0; j < r; j++) acc += src[row + Math.min(j, w - 1)];
          for (let x = 0; x < w; x++) {
            acc += src[row + Math.min(x + r, w - 1)];
            dst[row + x] = acc * norm + 0.5;
            acc -= src[row + Math.max(x - r, 0)];
          }
        }
      }

      function boxBlurV(src, dst, r) {
        const norm = 1 / (2 * r + 1);
        for (let x = 0; x < w; x++) {
          let acc = r * src[x];
          for (let j = 0; j < r; j++) acc += src[Math.min(j, h - 1) * w + x];
          for (let y = 0; y < h; y++) {
            acc += src[Math.min(y + r, h - 1) * w + x];
            dst[y * w + x] = acc * norm + 0.5;
            acc -= src[Math.max(y - r, 0) * w + x];
          }
        }
      }

      // Blurs a in place (using tmp as scratch space)
      function gaussianBlur(a, sigma) {
        for (const size of boxSizes(sigma, 3)) {
          const r = (size - 1) / 2;
          if (r < 1) continue;
          boxBlurH(a, tmp, r);
          boxBlurV(tmp, a, r);
        }
      }

      // Finds edges at one blur scale across the given channels (strongest channel wins),
      // keeps only the ridge of each edge (non-maximum suppression), and normalises so
      // this photo's strong edges come out around 1.
      function findEdges(sources, sigma) {
        const mag = new Uint16Array(n);   // gradient strength ÷ 2
        const dir = new Uint8Array(n);    // which neighbours lie across the edge
        for (const src of sources) {
          for (let i = 0; i < n; i++) buf[i] = src[i] * 256;
          gaussianBlur(buf, sigma);
          for (let y = 1; y < h - 1; y++) {
            for (let x = 1, i = y * w + 1; x < w - 1; x++, i++) {
              const gx = buf[i + 1] - buf[i - 1];
              const gy = buf[i + w] - buf[i - w];
              const m = Math.sqrt(gx * gx + gy * gy) / 2;
              if (m > mag[i]) {
                mag[i] = m;
                const ax = Math.abs(gx), ay = Math.abs(gy);
                dir[i] = ay <= 0.4142 * ax ? 0 : ay >= 2.4142 * ax ? 2 : gx * gy > 0 ? 1 : 3;
              }
            }
          }
        }

        // Keep a pixel only where it's the strongest point across the edge,
        // which turns blurry bands into thin lines on the edge's centre.
        const offsets = [1, w + 1, w, w - 1];
        let maxM = 1;
        for (let y = 1; y < h - 1; y++) {
          for (let x = 1, i = y * w + 1; x < w - 1; x++, i++) {
            const m = mag[i];
            const o = offsets[dir[i]];
            if (m > 0 && m >= mag[i - o] && m > mag[i + o]) {
              dir[i] |= 4;
              if (m > maxM) maxM = m;
            }
          }
        }

        // How strong are this photo's edges? Most ridges in a photo are faint grain, so the
        // median says how strong the grain is, and the top 0.5% says how strong real edges are.
        const BINS = 4096, hist = new Uint32Array(BINS);
        let count = 0;
        for (let i = 0; i < n; i++) {
          if (dir[i] & 4) {
            hist[Math.min(BINS - 1, Math.floor(mag[i] / maxM * BINS))]++;
            count++;
          }
        }
        let p50 = 0, strong = 0, seen = 0;
        for (let b = 0; b < BINS; b++) {
          seen += hist[b];
          if (!p50 && seen >= count * 0.5) p50 = (b + 1) / BINS * maxM;
          if (seen >= count * 0.995) { strong = (b + 1) / BINS * maxM; break; }
        }
        strong = Math.max(strong, 1);

        const out = new Uint16Array(n);
        for (let i = 0; i < n; i++) {
          if (dir[i] & 4) out[i] = Math.min(65535, mag[i] / strong * 16384);
        }
        edges.push(out);
        noise.push(Math.min(1, p50 / strong));
      }

      // Keeps edges at least `high` strong, plus any fainter ridge (down to `low`) that
      // connects to one. Real lines are long and connected, so their faint stretches
      // survive, while isolated specks of grain don't. Sets bit `bit` in kept[].
      function traceEdges(edge, low, high, bit) {
        let top = 0;
        // Edges never touch the image border, so neighbours are always in range
        const visit = q => {
          if (edge[q] >= low && !(kept[q] & bit)) {
            kept[q] |= bit;
            stack[top++] = q;
          }
        };
        for (let i = 0; i < n; i++) {
          if (edge[i] < high || kept[i] & bit) continue;
          kept[i] |= bit;
          stack[top++] = i;
          while (top) {
            const p = stack[--top];
            visit(p - w - 1); visit(p - w); visit(p - w + 1);
            visit(p - 1); visit(p + 1);
            visit(p + w - 1); visit(p + w); visit(p + w + 1);
          }
        }
      }

      self.onmessage = e => {
        const m = e.data;
        if (m.type === "image") {
          w = m.width;
          h = m.height;
          n = w * h;
          const px = new Uint8ClampedArray(m.buffer);
          const channels = [new Uint8Array(n), new Uint8Array(n), new Uint8Array(n)];
          lum = new Uint8Array(n);
          for (let i = 0; i < n; i++) {
            const a = px[4 * i + 3] / 255;   // see-through parts of the photo count as white
            const r = px[4 * i] * a + 255 * (1 - a);
            const g = px[4 * i + 1] * a + 255 * (1 - a);
            const b = px[4 * i + 2] * a + 255 * (1 - a);
            channels[0][i] = r;
            channels[1][i] = g;
            channels[2][i] = b;
            lum[i] = 0.299 * r + 0.587 * g + 0.114 * b;
          }
          buf = new Uint16Array(n);
          tmp = new Uint16Array(n);
          edges = [];
          noise = [];

          const longSide = Math.max(w, h);
          const fine = Math.max(1, longSide / 2500);
          findEdges(channels, fine);          // crisp detail, including colour-only edges
          findEdges([lum], fine * 2.5);       // softer edges that the fine pass sees only faintly

          toneBlur = new Uint16Array(n);
          for (let i = 0; i < n; i++) toneBlur[i] = lum[i] * 256;
          gaussianBlur(toneBlur, Math.max(2, longSide / 500));
          ink = buf;   // reuse: the edge pass is done with it
          kept = new Uint8Array(n);
          stack = new Uint32Array(n);
          self.postMessage({ type: "ready" });
          return;
        }

        if (m.type === "render") {
          // Line detail sets how faint an edge can be and still get drawn. Thresholds are
          // relative to this photo's grain level, so grain stays out at the default.
          // `high` starts a line; `low` is how faint a line may get while it continues.
          const lows = [], highs = [];
          kept.fill(0);
          for (let k = 0; k < edges.length; k++) {
            const high = Math.min(0.35, noise[k] * (4.5 - 1.5 * m.detail));
            const low = Math.min(high * 0.8, noise[k] * (2.2 - 1.4 * m.detail));
            highs.push(high);
            lows.push(low);
            // (at least 1, so tracing only ever follows actual edge ridges)
            traceEdges(edges[k], Math.max(1, low * 16384), Math.max(1, high * 16384), 1 << k);
          }
          // Line darkness: a curve that keeps faint edges visible as it's raised
          const LUT = 1024, curve = new Float32Array(LUT);
          for (let j = 0; j < LUT; j++) curve[j] = 1 - Math.exp(-m.darkness * j / 256);

          for (let i = 0; i < n; i++) {
            let strength = 0;
            if (kept[i]) {
              for (let k = 0; k < edges.length; k++) {
                if (!(kept[i] & (1 << k))) continue;
                const s = (edges[k][i] / 16384 - lows[k]) / (1 - lows[k]);
                if (s > strength) strength = s;
              }
            }
            ink[i] = curve[Math.min(LUT - 1, strength * 256 | 0)] * 60000;
          }

          // Line weight: blur the 1px lines into thicker ones, then scale back up so a
          // line keeps its darkness however thick it gets
          let boost = 1;
          if (m.thickness >= 0.6) {
            gaussianBlur(ink, m.thickness);
            boost = m.thickness * Math.sqrt(2 * Math.PI);
          }

          const [r, g, b] = m.color;
          const steps = m.tones;
          const out = new Uint8ClampedArray(n * 4);
          for (let i = 0; i < n; i++) {
            const line = Math.min(1, ink[i] / 60000 * boost);

            // Shading: smooth uses the sharp photo for full detail; value bands use the
            // softened photo so each band has clean edges.
            let tone;
            if (steps) {
              tone = 1 - toneBlur[i] / 65280;
              tone = Math.min(steps - 1, Math.floor(tone * steps)) / (steps - 1);
            } else {
              tone = Math.max(0, (1 - lum[i] / 255 - 0.05) / 0.95);   // brightest highlights stay bare paper
            }
            const shade = m.shading * tone;

            const a = 1 - (1 - line) * (1 - shade);
            out[4 * i] = r;
            out[4 * i + 1] = g;
            out[4 * i + 2] = b;
            out[4 * i + 3] = a * 255;
          }
          self.postMessage({ type: "render", id: m.id, width: w, height: h, buffer: out.buffer }, [out.buffer]);
        }
      };
    }

    let lineArt = storageGet("lineArt") === "1";
    let lineColor = Math.round(num(storageGet("lineColor"), 0));
    if (!(lineColor >= 0 && lineColor < LINE_COLORS.length)) lineColor = 0;
    let toneIndex = Math.round(num(storageGet("toneIndex"), 0));
    if (!(toneIndex >= 0 && toneIndex < TONE_STEPS.length)) toneIndex = 0;
    // Line weight and darkness changed meaning in the edge-detection version, so they use new keys
    const LINE_SLIDERS = [
      [detailSlider, "lineDetail", 0.6],
      [weightSlider, "lineThickness", 1],
      [strengthSlider, "lineDarkness", 3],
      [shadingSlider, "lineShading", 0.5]
    ];
    for (const [slider, key, fallback] of LINE_SLIDERS) slider.value = num(storageGet(key), fallback);

    let worker = null, workerHasImage = false, renderId = 0, renderTimer = null;

    function getWorker() {
      if (!worker) {
        const src = "(" + lineArtWorker.toString() + ")()";
        worker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
        worker.onmessage = onLineArt;
        worker.onerror = e => {
          console.error("Line art failed:", e);
          showToast("Line art isn't working on this device.");
        };
      }
      return worker;
    }

    function drawPhoto() {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      overlayCtx.drawImage(sourceImage, 0, 0, overlay.width, overlay.height);
    }

    function requestLineArt() {
      const w = getWorker();
      if (!workerHasImage) {
        drawPhoto();
        const data = overlayCtx.getImageData(0, 0, overlay.width, overlay.height);
        w.postMessage({ type: "image", width: data.width, height: data.height, buffer: data.data.buffer },
          [data.data.buffer]);
        workerHasImage = true;
        showToast("Making line art…");
      }
      // Line weight is relative to the photo's size, so it looks the same on any image
      const longSide = Math.max(overlay.width, overlay.height);
      w.postMessage({
        type: "render",
        id: ++renderId,
        detail: parseFloat(detailSlider.value),
        thickness: parseFloat(weightSlider.value) * longSide / 2000,
        darkness: parseFloat(strengthSlider.value),
        shading: parseFloat(shadingSlider.value),
        tones: TONE_STEPS[toneIndex],
        color: LINE_COLORS[lineColor][1]
      });
    }

    function onLineArt(e) {
      const m = e.data;
      if (m.type !== "render" || m.id !== renderId || !lineArt) return;   // a newer request is on its way
      overlayCtx.putImageData(new ImageData(new Uint8ClampedArray(m.buffer), m.width, m.height), 0, 0);
    }

    function renderOverlay({ debounce = false } = {}) {
      if (!sourceImage) return;
      clearTimeout(renderTimer);
      if (!lineArt) {
        renderId++;   // drop any line art still being worked on
        drawPhoto();
      } else if (debounce) {
        renderTimer = setTimeout(requestLineArt, 120);
      } else {
        requestLineArt();
      }
    }

    function updateLineUI() {
      lineBtn.classList.toggle("on", lineArt);
      lineRow.hidden = !lineArt;
      const [name, [r, g, b]] = LINE_COLORS[lineColor];
      colorSwatch.style.background = `rgb(${r}, ${g}, ${b})`;
      colorName.textContent = name;
      const steps = TONE_STEPS[toneIndex];
      tonesBtn.textContent = steps ? `${steps} tones` : "Smooth";
      tonesBtn.disabled = parseFloat(shadingSlider.value) === 0;
    }

    lineBtn.addEventListener("click", () => {
      if (!sourceImage) {
        showToast("Choose a photo first.");
        return;
      }
      lineArt = !lineArt;
      storageSet("lineArt", lineArt ? "1" : "0");
      updateLineUI();
      renderOverlay();
    });

    for (const [slider, key] of LINE_SLIDERS) {
      slider.addEventListener("input", () => {
        storageSet(key, slider.value);
        updateLineUI();
        renderOverlay({ debounce: true });
      });
    }

    tonesBtn.addEventListener("click", () => {
      toneIndex = (toneIndex + 1) % TONE_STEPS.length;
      storageSet("toneIndex", toneIndex);
      updateLineUI();
      renderOverlay();
    });

    colorBtn.addEventListener("click", () => {
      lineColor = (lineColor + 1) % LINE_COLORS.length;
      storageSet("lineColor", lineColor);
      updateLineUI();
      renderOverlay();
    });

    // ---------- Image storage (IndexedDB, since photos are too big for localStorage) ----------

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open("ar-drawer", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("kv");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const req = db.transaction("kv").objectStore("kv").get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbSet(key, value) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("kv", "readwrite");
        tx.objectStore("kv").put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function showOverlay(blob) {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      try {
        // Wait for "load" rather than img.decode(), which never finishes while the page is hidden
        await new Promise((resolve, reject) => {
          img.onload = resolve;
          img.onerror = () => reject(new Error("Image failed to load"));
          img.src = url;
        });
      } catch (e) {
        URL.revokeObjectURL(url);
        throw e;
      }
      if (overlayURL) URL.revokeObjectURL(overlayURL);
      overlayURL = url;

      const iw = img.naturalWidth, ih = img.naturalHeight;
      const fit = Math.min(1, MAX_SIDE / Math.max(iw, ih), Math.sqrt(MAX_AREA / (iw * ih)));
      overlay.width = Math.round(iw * fit);
      overlay.height = Math.round(ih * fit);
      sourceImage = img;
      workerHasImage = false;
      overlay.style.display = "block";
      drawPhoto();
      renderOverlay();
    }

    async function loadOverlay() {
      try {
        let blob = await idbGet("overlay");
        if (!blob) {
          // Move an image saved by an older version out of localStorage
          const legacy = storageGet("savedOverlay");
          if (legacy) {
            blob = await (await fetch(legacy)).blob();
            await idbSet("overlay", blob);
            storageRemove("savedOverlay");
          }
        }
        if (blob) await showOverlay(blob);
      } catch (e) {
        console.error("Could not load saved image:", e);
      }
    }

    function choosePhoto() {
      const picker = document.createElement("input");
      picker.type = "file";
      picker.accept = "image/*";
      picker.onchange = async () => {
        const file = picker.files[0];
        if (!file) return;
        const blob = new Blob([file], { type: file.type });
        try {
          await showOverlay(blob);
        } catch (e) {
          console.error("Could not open image:", e);
          alert("Couldn't open that image. Try a JPEG or PNG.");
          return;
        }
        resetTransform();
        resetView();
        setLocked(false);
        setSavedSpot(null);   // the old spot was for the old image
        try {
          await idbSet("overlay", blob);
        } catch (e) {
          console.error("Could not save image:", e);
          alert("This image couldn't be saved, so it won't be here after a reload.");
        }
      };
      picker.click();
    }

    photoBtn.addEventListener("click", choosePhoto);

    // ---------- Camera and lenses ----------

    let track = null;
    // Back cameras we can switch between, e.g. [{ name: "0.5×", deviceId }, { name: "1×", deviceId }].
    // A lens can also be "this camera at zoom 0.5" on phones that offer ultra-wide that way.
    let lenses = [];
    let currentLens = -1;

    function lensId(lens) {
      return { deviceId: lens.deviceId, zoom: lens.zoom };
    }

    function sameLens(a, b) {
      return a.deviceId === b.deviceId && (a.zoom || 1) === (b.zoom || 1);
    }

    async function openCamera(attempts) {
      let lastError = null;
      for (const videoConstraints of attempts) {
        try {
          return await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
        } catch (e) {
          lastError = e;
          if (e.name === "NotAllowedError") break;
        }
      }
      throw lastError || new Error("No camera");
    }

    async function useStream(stream) {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      const ready = new Promise(resolve => {
        video.addEventListener("loadedmetadata", resolve, { once: true });
        setTimeout(resolve, 3000);
      });
      video.srcObject = stream;
      track = stream.getVideoTracks()[0];
      await ready;
      layoutVideo();
    }

    function lensName(label) {
      if (/ultra/i.test(label)) return "0.5×";
      if (/tele/i.test(label)) return "Tele";
      if (/^back camera$/i.test(label) || /\bwide\b/i.test(label)) return "1×";
      return null;
    }

    async function findLenses() {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      const currentId = track.getSettings().deviceId;
      let devices = [];
      try {
        devices = (await navigator.mediaDevices.enumerateDevices())
          .filter(d => d.kind === "videoinput" && d.label && !/front|user|facetime/i.test(d.label));
      } catch (e) {
        console.warn("Could not list cameras:", e);
      }
      // iPhones also list "virtual" cameras that hop between lenses on their own,
      // which would knock the stencil out of alignment, so prefer the single lenses.
      const single = devices.filter(d => !/dual|triple/i.test(d.label));
      const list = (single.length ? single : devices).map((d, i) => ({
        deviceId: d.deviceId,
        name: lensName(d.label) || `Lens ${i + 1}`
      }));
      if (!list.some(l => l.deviceId === currentId)) list.push({ deviceId: currentId, name: "1×" });

      // Some phones offer the ultra-wide as zoom below 1 on the main camera instead
      if (caps.zoom && caps.zoom.min < 0.99 && !list.some(l => l.name === "0.5×")) {
        const main = list.find(l => l.deviceId === currentId);
        main.zoom = 1;
        main.name = "1×";
        list.push({ deviceId: currentId, zoom: caps.zoom.min, name: `${+caps.zoom.min.toFixed(1)}×` });
      }

      const order = name => name === "0.5×" || /^0\.\d×$/.test(name) ? 0 : name === "1×" ? 1 : name === "Tele" ? 2 : 3;
      lenses = list.sort((a, b) => order(a.name) - order(b.name));
      const saved = storageJSON("lens");
      currentLens = lenses.findIndex(l => saved && sameLens(l, saved) && l.deviceId === currentId);
      if (currentLens < 0) currentLens = lenses.findIndex(l => l.deviceId === currentId && (l.zoom || 1) === 1);
      updateLensUI();
    }

    function updateLensUI() {
      lensBtn.hidden = lenses.length < 2;
      if (lenses[currentLens]) lensBtn.textContent = `📷 ${lenses[currentLens].name}`;
    }

    async function applyZoom(zoom) {
      try {
        await track.applyConstraints({ advanced: [{ zoom }] });
      } catch (e) {
        console.warn("Camera zoom failed:", e);
      }
    }

    async function selectLens(index, { quiet = false } = {}) {
      const lens = lenses[index];
      if (track.getSettings().deviceId !== lens.deviceId) {
        try {
          await useStream(await openCamera([{ deviceId: { exact: lens.deviceId }, ...SHARP }]));
        } catch (e) {
          console.error("Could not switch lens:", e);
          showToast("Couldn't switch to that lens.");
          return;
        }
      }
      if (lens.zoom) await applyZoom(lens.zoom);
      currentLens = index;
      storageSet("lens", JSON.stringify(lensId(lens)));
      updateLensUI();
      if (!quiet) showToast(`Switched to the ${lens.name} lens. Realign the stencil if it moved, then 📌 Save spot.`);
    }

    lensBtn.addEventListener("click", () => {
      if (lenses.length > 1) selectLens((currentLens + 1) % lenses.length);
    });

    async function startCamera() {
      // Prefer the lens used last time, then the rear camera, then any camera
      const saved = storageJSON("lens");
      const attempts = [
        { facingMode: { exact: "environment" }, ...SHARP },
        { facingMode: "environment", ...SHARP },
        true
      ];
      if (saved && typeof saved.deviceId === "string") attempts.unshift({ deviceId: { exact: saved.deviceId }, ...SHARP });

      try {
        await useStream(await openCamera(attempts));
      } catch (e) {
        console.error("Camera error:", e);
        if (!window.isSecureContext) {
          alert("The camera only works when this page is opened over https.");
        } else if (e.name === "NotAllowedError") {
          alert("Camera access was blocked. Allow it in your browser settings and reload.");
        } else {
          alert("Could not access the camera.");
        }
        return;
      }

      await findLenses();
      if (saved && saved.zoom && lenses[currentLens] && lenses[currentLens].zoom) await applyZoom(saved.zoom);
    }

    // ---------- Keep the screen awake ----------

    let wakeLock = null, wakeLockPending = false;

    async function keepAwake() {
      if (!("wakeLock" in navigator) || wakeLock || wakeLockPending ||
          document.visibilityState !== "visible") return;
      wakeLockPending = true;
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } catch (e) {
        console.warn("Could not keep the screen awake:", e);
      } finally {
        wakeLockPending = false;
      }
    }

    // The lock is dropped whenever the page is hidden, so take it again on return.
    // Some browsers only grant it after a tap, so also retry on touch.
    document.addEventListener("visibilitychange", keepAwake);
    document.addEventListener("touchend", keepAwake);
    document.addEventListener("click", keepAwake);

    // ---------- Touch gestures ----------

    // Gestures are handled for the whole screen (not just the stage), so you can still
    // pinch on the black border when zoomed out below 1×. Touches on buttons and
    // sliders are left alone.
    function isUI(el) {
      return controls.contains(el) || lensBtn.contains(el) || zoomBadge.contains(el);
    }

    // Each gesture either edits the stencil ("image") or moves the detail zoom ("view").
    // That's decided when the first finger lands: on the stencil while it's unlocked
    // means "image"; anywhere else, or anywhere while locked, means "view".
    let mode = null;
    // The current drag/pinch. It's rebuilt whenever the set of fingers changes,
    // so adding or lifting a finger never makes anything jump.
    let gesture = null;
    let tap = null;       // the touch in progress, while it could still be a tap
    let lastTap = null;   // the previous completed tap, for double-tap detection
    let multiTap = null;  // tracks whether the whole gesture could be a two-finger tap

    function pinchInfo(t1, t2) {
      const dx = t2.clientX - t1.clientX;
      const dy = t2.clientY - t1.clientY;
      return {
        x: (t1.clientX + t2.clientX) / 2,
        y: (t1.clientY + t2.clientY) / 2,
        dist: Math.hypot(dx, dy),
        angle: Math.atan2(dy, dx)
      };
    }

    function startGesture(touches) {
      if (touches.length === 1) {
        const t = touches[0];
        gesture = { count: 1, ids: [t.identifier], x: t.clientX, y: t.clientY };
      } else if (touches.length >= 2) {
        gesture = { count: 2, ids: [touches[0].identifier, touches[1].identifier], ...pinchInfo(touches[0], touches[1]) };
      } else {
        gesture = null;
      }
    }

    function gestureMatches(touches) {
      if (!gesture) return false;
      if (gesture.count === 1) return touches.length === 1 && touches[0].identifier === gesture.ids[0];
      return touches.length >= 2 &&
        touches[0].identifier === gesture.ids[0] &&
        touches[1].identifier === gesture.ids[1];
    }

    function moveImage(e) {
      if (gesture.count === 1) {
        const t = e.touches[0];
        // Finger movement is in screen pixels; divide by the zoom to get stage pixels
        originX += (t.clientX - gesture.x) / viewZoom;
        originY += (t.clientY - gesture.y) / viewZoom;
        gesture.x = t.clientX;
        gesture.y = t.clientY;
      } else {
        const p = pinchInfo(e.touches[0], e.touches[1]);
        const newScale = gesture.dist > 0 ? clampScale(scale * p.dist / gesture.dist) : scale;
        const f = newScale / scale;
        let dA = p.angle - gesture.angle;
        if (dA > Math.PI) dA -= 2 * Math.PI;
        else if (dA < -Math.PI) dA += 2 * Math.PI;

        // Scale and rotate around the point between your fingers (not the image centre),
        // and let the image follow as both fingers move together.
        const r = overlay.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        const vx = cx - gesture.x, vy = cy - gesture.y;
        const cos = Math.cos(dA), sin = Math.sin(dA);
        originX += (p.x + f * (vx * cos - vy * sin) - cx) / viewZoom;
        originY += (p.y + f * (vx * sin + vy * cos) - cy) / viewZoom;

        scale = newScale;
        rotation += dA * 180 / Math.PI;
        Object.assign(gesture, { x: p.x, y: p.y, dist: p.dist, angle: p.angle });
      }
      applyTransform();
    }

    function moveView(e) {
      if (gesture.count === 1) {
        const t = e.touches[0];
        viewX += t.clientX - gesture.x;
        viewY += t.clientY - gesture.y;
        gesture.x = t.clientX;
        gesture.y = t.clientY;
        applyView();
      } else {
        const p = pinchInfo(e.touches[0], e.touches[1]);
        const f = gesture.dist > 0 ? p.dist / gesture.dist : 1;
        // Pan with the midpoint, then zoom around it
        viewX += p.x - gesture.x;
        viewY += p.y - gesture.y;
        zoomViewAround(viewZoom * f, p.x, p.y);
        Object.assign(gesture, { x: p.x, y: p.y, dist: p.dist, angle: p.angle });
      }
    }

    document.addEventListener("touchstart", e => {
      // A new gesture starts when these are the only fingers on the screen
      if (e.touches.length === e.changedTouches.length) {
        mode = isUI(e.target) ? "ui" : e.target === overlay && !locked ? "image" : "view";
        multiTap = mode === "ui" ? null : { start: Date.now(), maxFingers: 0, moved: false, starts: {} };
      }
      if (mode === "ui") return;
      if (multiTap) {
        for (const t of e.changedTouches) multiTap.starts[t.identifier] = { x: t.clientX, y: t.clientY };
        multiTap.maxFingers = Math.max(multiTap.maxFingers, e.touches.length);
      }
      stage.classList.remove("animate");
      overlay.classList.remove("animate");
      startGesture(e.touches);
      const t = e.touches[0];
      tap = e.touches.length === 1 ? { x: t.clientX, y: t.clientY, time: Date.now() } : null;
    });

    document.addEventListener("touchmove", e => {
      if (mode === "ui" || !mode) return;   // let sliders work normally
      e.preventDefault();

      if (tap && (e.touches.length > 1 ||
          Math.hypot(e.touches[0].clientX - tap.x, e.touches[0].clientY - tap.y) > TAP_SLOP)) {
        tap = null;
      }
      if (multiTap && !multiTap.moved) {
        for (const t of e.changedTouches) {
          const s = multiTap.starts[t.identifier];
          if (s && Math.hypot(t.clientX - s.x, t.clientY - s.y) > TAP_SLOP) multiTap.moved = true;
        }
      }

      if (!gestureMatches(e.touches)) {
        startGesture(e.touches);
        return;
      }

      if (mode === "image") moveImage(e);
      else moveView(e);
    }, { passive: false });

    function onDoubleTap(x, y) {
      if (mode === "image") {
        resetTransform();
      } else if (Math.abs(viewZoom - 1) > 0.01) {
        resetView();
      } else {
        zoomViewAround(DETAIL_ZOOM, x, y, true);
      }
    }

    document.addEventListener("touchend", e => {
      if (mode === "ui") return;
      startGesture(e.touches);
      if (e.touches.length > 0) return;
      const now = Date.now();

      // Two fingers tapped together and lifted, without moving: jump back to the saved spot
      if (multiTap && multiTap.maxFingers === 2 && !multiTap.moved && now - multiTap.start < 400) {
        revertToSavedSpot();
        multiTap = null;
        lastTap = null;
        return;
      }
      multiTap = null;

      // All fingers are up: was that a quick, still, single-finger tap?
      const wasTap = tap && now - tap.time < DOUBLE_TAP_MS;
      if (wasTap && lastTap && lastTap.mode === mode && now - lastTap.time < DOUBLE_TAP_MS &&
          Math.hypot(tap.x - lastTap.x, tap.y - lastTap.y) < 40) {
        onDoubleTap(tap.x, tap.y);
        lastTap = null;
      } else {
        lastTap = wasTap ? { x: tap.x, y: tap.y, time: now, mode } : null;
      }
      if (mode === "image") saveTransform();
      tap = null;
    });

    document.addEventListener("touchcancel", () => {
      gesture = null;
      tap = null;
      multiTap = null;
      if (mode === "image") saveTransform();
    });

    // ---------- Long-press to choose a photo (only while unlocked) ----------

    let pressTimer = null, pressStart = null;

    function cancelLongPress() {
      clearTimeout(pressTimer);
      pressTimer = null;
    }

    document.addEventListener("touchstart", e => {
      cancelLongPress();
      if (e.touches.length > 1 || locked || isUI(e.target)) return;
      pressStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      pressTimer = setTimeout(() => {
        pressTimer = null;
        choosePhoto();
      }, LONG_PRESS_MS);
    });

    document.addEventListener("touchmove", e => {
      if (pressTimer && (e.touches.length > 1 ||
          Math.hypot(e.touches[0].clientX - pressStart.x, e.touches[0].clientY - pressStart.y) > TAP_SLOP)) {
        cancelLongPress();
      }
    }, { passive: true });

    document.addEventListener("touchend", cancelLongPress);
    document.addEventListener("touchcancel", cancelLongPress);

    // ---------- Start up ----------

    loadTransform();
    applyTransform();
    layoutVideo();
    setLocked(storageGet("imageLocked") === "1");
    setCollapsed(storageGet("panelCollapsed") === "1");
    setSavedSpot(readSpot(storageJSON("savedSpot")));
    updateLineUI();
    loadOverlay();
    startCamera();
    keepAwake();
  </script>
</body>
</html>
